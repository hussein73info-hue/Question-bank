<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الثقافة المالية | الأستاذ حسين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">💰</div>
                <div>
                    <h1>الثقافة المالية</h1>
                    <p>المشرف التربوي - الأستاذ حسين</p>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stat-pill">الدروس المنجزة: <span id="done-lessons">0</span></div>
            </div>
        </div>
        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="goPage('p-bank')">بنك الأسئلة</button>
            <button class="nav-tab" onclick="goPage('p-quiz')">اختبار ذاتي</button>
            <button class="nav-tab" onclick="goPage('p-exam')">نماذج مقترحة</button>
        </nav>
    </header>

    <main class="main">
        <section id="p-bank" class="page active">
            <div class="sem-tabs">
                <button class="sem-btn f1 active" onclick="selSem(1)">الفصل الأول</button>
                <button class="sem-btn f2" onclick="selSem(2)">الفصل الثاني</button>
            </div>
            <div id="unit-grid" class="unit-grid"></div>
            <div id="lesson-container"></div>
        </section>

        <section id="p-quiz" class="page">
            <div class="card quiz-setup">
                <h3>تجهيز الاختبار الذاتي</h3>
                <div class="setup-grid">
                    <div class="setup-opt sel" id="opt-q-1" onclick="qSelSem(1)">
                        <div class="so-icon">📘</div>
                        <div class="so-name">الفصل الأول</div>
                    </div>
                    <div class="setup-opt" id="opt-q-2" onclick="qSelSem(2)">
                        <div class="so-icon">📗</div>
                        <div class="so-name">الفصل الثاني</div>
                    </div>
                </div>
                <div class="btn-row" style="margin-top:20px;">
                    <button class="btn btn-primary btn-lg" onclick="startQuiz()">ابدأ الاختبار الآن</button>
                </div>
            </div>
        </section>

        <section id="p-exam" class="page">
            <div class="card">
                <div class="empty">
                    <div class="ei">📝</div>
                    <p>قريباً سيتم إضافة النماذج المقترحة للامتحانات الوزارية.</p>
                </div>
            </div>
        </section>
    </main>

    <div id="quiz-overlay">
        <div class="quiz-header">
            <div class="quiz-header-inner">
                <div class="quiz-title" id="qz-title">اختبار الثقافة المالية</div>
                <div class="quiz-timer" id="timer">00:00</div>
            </div>
            <div class="quiz-progress-bar">
                <div class="quiz-progress-fill" id="qz-progress" style="width: 0%"></div>
            </div>
        </div>
        <div class="quiz-body" id="qz-body">
            </div>
        <div class="quiz-nav">
            <span class="q-counter" id="qz-step">السؤال 1 من 10</span>
            <button class="btn btn-primary" onclick="nextQ()">السؤال التالي</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
